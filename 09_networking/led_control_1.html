<!DOCTYPE html>
<html>
<head>
  <title>RGB LED Controller</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
    }

    #avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 20px auto;
      box-shadow: 0 0 20px #ffffff;
      transition: box-shadow 0.3s ease, filter 0.3s ease;
    }

    #colorPicker {
      width: 150px;
      height: 40px;
      border: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Pick a Color for Your LED!</h2>

  <!-- Avatar -->
  <img id="avatar" src="Hello-kitty-avatar.jpeg" alt="Avatar">

  <!-- Color Picker -->
  <input type="color" id="colorPicker" value="#ffffff">
  <p>Selected Color: <span id="colorValue">#ffffff</span></p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <script>
    // 🔧 Replace with your real Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyB3pOoyKCrTZ6eX1uIjMQAr2PlG3mj_eXA",
  authDomain: "control-led-27.firebaseapp.com",
  databaseURL: "https://control-led-27-default-rtdb.firebaseio.com",
  projectId: "control-led-27",
  storageBucket: "control-led-27.firebasestorage.app",
  messagingSenderId: "878164458706",
  appId: "1:878164458706:web:2d6fe297200606daa8c10b",
  measurementId: "G-FP2X9942N1"
    };

    firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const picker = document.getElementById("colorPicker");
  const display = document.getElementById("colorValue");
  const avatar = document.getElementById("avatar");

  const neutralAvatar = "Hello-kitty-avatar.jpeg";
  const smileAvatar = "HELLO KITTY LOVER.jpeg";

  let smileTimeout;
  let debounceTimeout;

  picker.addEventListener("input", () => {
    clearTimeout(debounceTimeout);

    debounceTimeout = setTimeout(() => {
      const hex = picker.value;
      display.textContent = hex;

      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);

      avatar.style.boxShadow = `0 0 30px rgb(${r}, ${g}, ${b})`;
      avatar.src = smileAvatar;

      // Clear and reset smile timer
      clearTimeout(smileTimeout);
      smileTimeout = setTimeout(() => {
        avatar.src = neutralAvatar;
      }, 1500);

      // Update Firebase
      db.ref("/ledColor").set({ r, g, b });
    }, 200); // Wait 200ms after last input
  });
</script>
