<!DOCTYPE html>
<html>
<head>
  <title>RGB LED Controller</title>
  <meta charset="UTF-8">
</head>
<body>
  <h2>Pick a Color for Your LED</h2>
  <input type="color" id="colorPicker" value="#ffffff">
  <p>Selected Color: <span id="colorValue">#ffffff</span></p>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <script>
    // Replace these with your Firebase project values
    const firebaseConfig = {
      apiKey: "AIzaSyB3pOoyKCrTZ6eX1uIjMQAr2PlG3mj_eXA",
  authDomain: "control-led-27.firebaseapp.com",
  databaseURL: "https://control-led-27-default-rtdb.firebaseio.com",
  projectId: "control-led-27",
  storageBucket: "control-led-27.firebasestorage.app",
  messagingSenderId: "878164458706",
  appId: "1:878164458706:web:2d6fe297200606daa8c10b",
  measurementId: "G-FP2X9942N1"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const picker = document.getElementById("colorPicker");
    const display = document.getElementById("colorValue");

    // Listen for color changes
    picker.addEventListener("input", () => {
      const hex = picker.value;
      display.textContent = hex;

      // Convert HEX to RGB
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);

      // Write to Firebase at /ledColor
      db.ref("/ledColor").set({ r, g, b })
        .then(() => console.log(`Sent RGB: ${r}, ${g}, ${b}`))
        .catch((error) => console.error("Firebase Error:", error));
    });
  </script>
</body>
</html>
